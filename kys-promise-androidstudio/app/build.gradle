plugins {
     id 'com.android.application'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId = "org.libsdl.kys_promise"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                // NDK clang++.exe on Windows defaults to windows-gnu; CMake does not
                // always pass CMAKE_CXX_COMPILER_TARGET into try_compile. Inject --target.
                arguments "-DANDROID_PLATFORM=android-29",
                        "-DANDROID_STL=c++_shared",
                        "-DCMAKE_C_FLAGS=--target=aarch64-linux-android29",
                        "-DCMAKE_CXX_FLAGS=--target=aarch64-linux-android29",
                        "-DCMAKE_EXE_LINKER_FLAGS=--target=aarch64-linux-android29",
                        "-DCMAKE_SHARED_LINKER_FLAGS=--target=aarch64-linux-android29"
                abiFilters 'arm64-v8a'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "kys-promise-${variant.buildType.name}.apk"
            }
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")

    }
    // Native libs come only from CMake (SDL3 + kys_promise). No prebuilt jniLibs/.
    // NDK 27 + SDK CMake 3.22 breaks CXX link tests (lld --no-rosegment); pin newer CMake.
    ndkVersion "27.0.12077973"
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version '3.31.6'
            }
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
